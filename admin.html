<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARVIX Admin</title><style>body{margin:0;font-family:Arial;background:#f4f4f1;color:#222}.top{background:#171717;color:white;padding:20px 5%;display:flex;justify-content:space-between}.top a{color:#ef6c00}.wrap{max-width:1100px;margin:40px auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.box{background:white;border-radius:16px;padding:22px}.card b{font-size:32px;color:#ef6c00}.box{margin-top:20px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:13px}button{background:#ef6c00;color:white;border:0;padding:10px 14px;border-radius:8px}@media(max-width:700px){.cards{grid-template-columns:1fr}.wrap{margin:10px}}</style></head><body><div class="top"><b>CARVIX • PAINEL</b><a href="index.html">Ver site</a></div><div class="wrap"><div class="cards"><div class="card"><small>Leads recebidos</small><br><b id="total">0</b></div><div class="card"><small>Novos hoje</small><br><b id="today">0</b></div><div class="card"><small>Status</small><br><b>Online</b></div></div><div class="box"><h2>Solicitações de orçamento</h2><table><thead><tr><th>Data</th><th>Nome</th><th>Contato</th><th>Serviço</th><th>Mensagem</th></tr></thead><tbody id="rows"></tbody></table><p id="empty">Nenhuma solicitação ainda.</p><button id="clear">Limpar dados demo</button></div></div><script>const l=JSON.parse(localStorage.getItem('carvix_leads')||'[]');total.textContent=l.length;today.textContent=l.filter(x=>x.data&&x.data.includes(new Date().toLocaleDateString('pt-BR'))).length;empty.style.display=l.length?'none':'block';rows.innerHTML=l.map(x=>'<tr><td>'+x.data+'</td><td>'+x.nome+'</td><td>'+[x.telefone,x.email].filter(Boolean).join('<br>')+'</td><td>'+x.servico+'</td><td>'+(x.mensagem||'')+'</td></tr>').join('');clear.onclick=()=>{localStorage.removeItem('carvix_leads');location.reload()}</script></body></html>
